<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPL HTML Kit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/app.css?v=0.16.17">
  <style>
    body { background: #f8fafc; }
    #lib { max-width: 1080px; margin: 0 auto; padding: 48px 24px 120px; }
    code, .lib-sec small { font-family: "Geist Mono", ui-monospace, monospace; }
    .lib-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 24px; }
    .lib-eyebrow { font-size: 12px; font-weight: 600; color: var(--primary); letter-spacing: .04em; text-transform: uppercase; }
    .lib-head h1 { font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.5px; margin: 6px 0 8px; }
    .lib-lede { max-width: 640px; color: var(--muted-foreground); font-size: 15px; line-height: 23px; }
    .lib-lede a, .lib-sec h2 a { color: var(--primary); text-decoration: none; }
    .lib-back { flex-shrink: 0; padding: 8px 14px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px var(--border); color: var(--foreground); text-decoration: none; font-size: 14px; font-weight: 500; }
    .lib-toc { position: sticky; top: 0; z-index: 10; display: flex; gap: 4px; overflow-x: auto; padding: 10px 0; margin-bottom: 8px; background: rgba(248,250,252,.9); backdrop-filter: blur(8px); scrollbar-width: none; }
    .lib-toc a { flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); text-decoration: none; }
    .lib-toc a:hover { background: #fff; color: var(--foreground); }
    .lib-sec { padding: 40px 0 8px; border-top: 1px solid var(--border); scroll-margin-top: 56px; }
    .lib-sec h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 20px; line-height: 28px; font-weight: 600; margin-bottom: 16px; }
    .lib-sec h2 a, .lib-sec h2 small { font-size: 12px; font-weight: 400; color: var(--primary); }
    .lib-sec h2 small { color: var(--tertiary-foreground); }
    .lib-sec h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--tertiary-foreground); margin: 20px 0 10px; }
    .lib-use { color: var(--muted-foreground); font-size: 14px; line-height: 21px; margin: -8px 0 16px; max-width: 680px; }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .swatch { display: grid; gap: 4px; }
    .swatch span { height: 56px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(15,23,42,.08); }
    .swatch code { font-size: 12px; } .swatch small { font-size: 11px; color: var(--tertiary-foreground); text-transform: uppercase; }
    .type-list { display: grid; background: #fff; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--border); }
    .type-row { display: grid; grid-template-columns: 260px 1fr; align-items: center; gap: 16px; padding: 16px 20px; border-top: 1px solid var(--border); }
    .type-row:first-child { border-top: 0; }
    .type-row b { display: block; font-size: 13px; font-weight: 500; } .type-row small { font-size: 11px; color: var(--tertiary-foreground); }
    .spacing { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
    .spacing div { display: grid; justify-items: center; gap: 6px; } .spacing span { height: 32px; background: var(--primary); opacity: .25; border-radius: 2px; }
    .spacing small, .radii small, .icons small { font-size: 11px; color: var(--tertiary-foreground); }
    .radii { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
    .radii div { display: grid; justify-items: center; gap: 8px; } .radii span { width: 72px; height: 56px; background: var(--tile); box-shadow: inset 0 0 0 1px var(--border); }
    .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .icons div { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px var(--border); }
    .icons small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
    .demo { margin: 0; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 1px var(--border); }
    .demo__stage { display: flex; align-items: center; justify-content: center; min-height: 140px; padding: 32px 24px; background: #fff; }
    .demo figcaption { display: grid; gap: 4px; padding: 12px 16px; border-top: 1px solid var(--border); background: #fbfcfe; }
    .demo figcaption b { font-size: 12px; font-weight: 500; } .demo figcaption code { font-size: 11.5px; color: var(--muted-foreground); white-space: pre-wrap; }
    @media (max-width: 600px) { .demos { grid-template-columns: 1fr; } .demo__stage { overflow-x: auto; justify-content: flex-start; } .type-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="lib"></main>
  <script src="dist/app.js?v=0.16.17"></script>
  <script src="js/library.js"></script>
</body>
</html>
